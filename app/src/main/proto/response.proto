syntax = "proto3";
package geopki;

option go_package = "pkg/comm";

message CTLogServer {
  bytes LogId = 1;
  bytes SignedTreeHead = 2;
}

message SignedConsistencyHead {
  bytes RootHash = 1;
  uint64 Timestamp = 2;
  uint64 Size = 3;

  bytes Signature = 4;
}

message SignedMapHead {
  bytes RootHash = 1;
  uint64 Timestamp = 2;
  repeated CTLogServer CoveredCTLogServers = 3;

  bytes Signature = 4;

  // the map format, see crypto.MapHeadVersion
  uint32 Version = 5;
}

// a node corresponds to a database row
message Node {
  // the 51 bits of the xy bit string
  uint64 XYBitString = 1;
  uint32 XYBitStringLen = 2;

  // the 15 bits of the z bit string
  uint32 ZBitString = 3;
  uint32 ZBitStringLen = 4;

  // optional hash values of all children
  optional bytes XYLeftChildHash = 5;
  optional bytes XYRightChildHash = 6;
  optional bytes ZLeftChildHash = 7;
  optional bytes ZRightChildHash = 8;

  // the entries of the certificates at this node, one per type a
  // certificate has: len(type) | type | SHA-256(certificate), see crypto.NewEntry.
  // Field 9 held plain certificate hashes (map version 1); reserved, so an old
  // client finds no hashes and fails its root check instead of misreading entries
  reserved 9;
  repeated bytes Entries = 10;
}

message Response {
  optional SignedConsistencyHead SignedConsistencyHead = 1;
  optional SignedMapHead SignedMapHead = 2;
  optional bytes InclusionProof = 3;

  repeated Node Nodes = 4;

  repeated bytes Certificates = 5;
}